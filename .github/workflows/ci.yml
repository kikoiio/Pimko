name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      # 构建/冒烟不需要 Electron 二进制；跳过下载以加速并省资源
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Generate fixtures
        run: npm run fixtures
      - name: Fixture checks (probe → silence → draft → export)
        run: npm run check:fixtures
      - name: Smoke (create draft → revise → export)
        run: npm run smoke
      - name: MCP smoke (external client roundtrip)
        run: npm run smoke:mcp

  ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install system deps
        run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          ffmpeg xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2
          libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2
          libgbm1 libasound2t64 libpango-1.0-0 libcairo2 fonts-noto-cjk
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: ''
      - run: npm run typecheck
      - run: npm run build
      - name: UI E2E (mock pipeline)
        run: xvfb-run -a npm run test:ui

  e2e-openai:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        model:
          - ${{ vars.PIMKO_LLM_MODEL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install system deps
        run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          ffmpeg espeak-ng xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2
          libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2
          libgbm1 libasound2t64 libpango-1.0-0 libcairo2 fonts-noto-cjk
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: ''
      - run: npm run typecheck
      - run: npm run build
      - name: Generate voice sample
        run: |
          mkdir -p .tmp sample-assets
          espeak-ng -v en-us -s 140 -w .tmp/voice.wav "Hello and welcome to Pimko. This is a test talking head video for the editing agent. Let us try editing it."
          ffmpeg -y -v error -i .tmp/voice.wav -f lavfi -i 'testsrc=duration=10:size=640x360:rate=30' -shortest -c:v libx264 -pix_fmt yuv420p -c:a aac sample-assets/voice.mp4
      - name: Fixtures and public samples
        run: |
          npm run fixtures
          npm run samples
      - name: Real transcription checks
        run: npx tsx scripts/check-fixtures.ts --only talking-head-en --transcribe
        env:
          PIMKO_LLM_PROVIDER: openai
          PIMKO_LLM_API_KEY: ${{ secrets.OPENROUTER_LLM_API_KEY }}
          PIMKO_LLM_MODEL: ${{ matrix.model }}
          PIMKO_TRANSCRIBE_MODEL: ${{ vars.PIMKO_TRANSCRIBE_MODEL }}
          PIMKO_TRANSCRIBE_API_KEY: ${{ secrets.GROQ_LLM_API_KEY }}
          PIMKO_TRANSCRIBE_BASE_URL: ${{ vars.PIMKO_TRANSCRIBE_BASE_URL }}
          PIMKO_LLM_BASE_URL: ${{ vars.PIMKO_LLM_BASE_URL }}
      - name: UI E2E (OpenAI pipeline)
        run: xvfb-run -a npm run test:ui
        env:
          PIMKO_E2E_VIDEO: ${{ github.workspace }}/sample-assets/voice.mp4
          PIMKO_LLM_PROVIDER: openai
          PIMKO_LLM_API_KEY: ${{ secrets.OPENROUTER_LLM_API_KEY }}
          PIMKO_LLM_MODEL: ${{ matrix.model }}
          PIMKO_TRANSCRIBE_MODEL: ${{ vars.PIMKO_TRANSCRIBE_MODEL }}
          PIMKO_TRANSCRIBE_API_KEY: ${{ secrets.GROQ_LLM_API_KEY }}
          PIMKO_TRANSCRIBE_BASE_URL: ${{ vars.PIMKO_TRANSCRIBE_BASE_URL }}
          PIMKO_LLM_BASE_URL: ${{ vars.PIMKO_LLM_BASE_URL }}
      - name: Upload E2E artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pimko-e2e-${{ strategy.matrix.index }}
          path: |
            .tmp/pimko-e2e.png
            .tmp/pimko-e2e-result.json
            .tmp/pimko-e2e-final.png
            .tmp/pimko-e2e-failure.png
            .tmp/pimko-e2e-error.txt
          if-no-files-found: ignore
